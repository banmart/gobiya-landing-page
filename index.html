<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--canonical-outlet-->
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    
    <!-- SAY Agency Stylesheets -->
    <link rel="stylesheet" href="https://sayagency.com/wp-includes/css/dist/block-library/style.min.css?ver=1982246e4f425447be111e9d31b4a610" />
    <link rel="stylesheet" href="https://sayagency.com/wp-content/themes/say/css/swiper/swiper.min.css" />
    <link rel="stylesheet" href="https://sayagency.com/wp-content/themes/say/css/swiper/effect-fade.min.css" />
    <link rel="stylesheet" href="https://sayagency.com/wp-content/themes/say/css/swiper/free-mode.min.css" />
    <link rel="stylesheet" href="/css/tailwind.css" />
    <link rel="stylesheet" href="/css/theme.css" />

    <!-- SAY Agency Scripts (Deferred/Async) -->
    <script src="/js/jquery.min.js"></script>
    <script src="https://player.vimeo.com/api/player.js"></script>
    <script src="https://sayagency.com/wp-content/themes/say/js/swiper/swiper-bundle.min.js"></script>
    <script src="/js/animations.js" defer></script>
    <script src="/js/theme.js" defer></script>

    <style>
      :root {
        --paper: #FFFFFF;
        --ink: #111827;
        --font-body: 'Inter', sans-serif;
      }
      body {
        background-color: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        margin: 0;
      }
      /* Minimal skeleton for initial paint */
      #root { min-height: 100vh; }
    </style>

    <!-- Primary SEO Metadata (Outcomes Approach) -->
    <!--ssr-title-->
    <!--ssr-desc-->
    <link rel="icon" type="image/png" href="/images/favicon-gobiya-07082026.png" />
    <link rel="apple-touch-icon" href="/images/favicon-gobiya-07082026.png" />

    <!-- Open Graph / Social Bot Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gobiya.com" />
    <!--ssr-og-title-->
    <!--ssr-og-desc-->
    <!--ssr-og-image-->

    <!-- Twitter Bot Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <!--ssr-twitter-title-->
    <!--ssr-twitter-desc-->
    <!--ssr-twitter-image-->

    <!-- Structured Schema for Bots (JSON-LD) -->
    <!--schema-outlet-->

    <!-- Pinterest Domain Verification -->
    <meta name="p:domain_verify" content="422d36275e412e182dff33f542a68498"/>

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="BCJ8-9rzY9X5CjZqM2hY7erF-1vFCZHFKl-Y-nbXv3U" />

    <!-- Deferred Analytics & Tracking -->
    <script>
      function loadTrackingScripts() {
        if (window.trackingLoaded) return;
        window.trackingLoaded = true;
        
        // GA4
        const ga = document.createElement('script');
        ga.src = "https://www.googletagmanager.com/gtag/js?id=G-3R3D5Q9YV6";
        ga.async = true;
        document.head.appendChild(ga);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-3R3D5Q9YV6', { anonymize_ip: true, send_page_view: true });

        // Clarity
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "v5j018vnnn");
      }

      // Load on interaction or after 3.5s
      ['mousemove', 'scroll', 'touchstart', 'click'].forEach(e => 
        window.addEventListener(e, loadTrackingScripts, { once: true })
      );
      setTimeout(loadTrackingScripts, 3500);
    </script>
  </head>
  <body class="say bg-white text-gray-900 antialiased">
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
