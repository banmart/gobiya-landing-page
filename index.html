<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--canonical-outlet-->
    
    <link rel="preload" href="/fonts/font-3.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      :root {
        --paper: #EFEDE5;
        --ink: #15130E;
        --font-body: 'Bricolage Grotesque', sans-serif;
      }
      body {
        background-color: var(--paper);
        color: var(--ink);
        font-family: var(--font-body);
        margin: 0;
      }
      /* Minimal skeleton for initial paint */
      #root { min-height: 100vh; }
    </style>

    <!-- Primary SEO Metadata (Outcomes Approach) -->
    <!--ssr-title-->
    <!--ssr-desc-->
    <link rel="icon" type="image/jpeg" href="/images/gobiya---favicon.jpg" />

    <!-- Open Graph / Social Bot Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gobiya.com" />
    <!--ssr-og-title-->
    <!--ssr-og-desc-->
    <!--ssr-og-image-->

    <!-- Twitter Bot Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <!--ssr-twitter-title-->
    <!--ssr-twitter-desc-->
    <!--ssr-twitter-image-->

    <!-- Structured Schema for Bots (JSON-LD) -->
    <!--schema-outlet-->

    <!-- Pinterest Domain Verification -->
    <meta name="p:domain_verify" content="422d36275e412e182dff33f542a68498"/>

    <!-- Google Site Verification -->
    <meta name="google-site-verification" content="BCJ8-9rzY9X5CjZqM2hY7erF-1vFCZHFKl-Y-nbXv3U" />

    <!-- Deferred Analytics & Tracking -->
    <script>
      function loadTrackingScripts() {
        if (window.trackingLoaded) return;
        window.trackingLoaded = true;
        
        // GA4
        const ga = document.createElement('script');
        ga.src = "https://www.googletagmanager.com/gtag/js?id=G-3R3D5Q9YV6";
        ga.async = true;
        document.head.appendChild(ga);
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-3R3D5Q9YV6', { anonymize_ip: true, send_page_view: true });

        // Clarity
        (function(c,l,a,r,i,t,y){
          c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
          t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
          y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "v5j018vnnn");
      }

      // Load on interaction or after 3.5s
      ['mousemove', 'scroll', 'touchstart', 'click'].forEach(e => 
        window.addEventListener(e, loadTrackingScripts, { once: true })
      );
      setTimeout(loadTrackingScripts, 3500);
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
